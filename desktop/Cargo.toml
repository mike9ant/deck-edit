[package]
name = "deck-edit-desktop"
version = "0.2.3"
edition = "2021"
description = "Tauri desktop app for Deck Edit"

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "2", features = [] }
tauri-plugin-single-instance = "2"
deck-edit = { path = "../backend" }
tokio = { version = "1", features = ["full"] }
anyhow = "1"
tracing = "0.1"
