<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 520 720" width="520" height="720">
  <!-- The Queen of Hearts, chair of the Orbital Beverage Authority — with her usual ruling stamped on. -->
  <defs>
    <linearGradient id="card" x1="0" y1="0" x2="1" y2="1"><stop offset="0" stop-color="#FFFFFF"/><stop offset="1" stop-color="#F4ECE0"/></linearGradient>
    <radialGradient id="heart" cx="40%" cy="35%" r="70%"><stop offset="0" stop-color="#F0505F"/><stop offset="1" stop-color="#A81B2E"/></radialGradient>
    <linearGradient id="gold" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#FFE7A0"/><stop offset="1" stop-color="#D99A22"/></linearGradient>
    <path id="h" d="M0 18 C -26 2, -26 -16, -12 -18 C -6 -19, -1 -14, 0 -9 C 1 -14, 6 -19, 12 -18 C 26 -16, 26 2, 0 18 Z"/>
    <filter id="shadow" x="-20%" y="-20%" width="140%" height="140%"><feDropShadow dx="0" dy="10" stdDeviation="12" flood-color="#14123A" flood-opacity="0.35"/></filter>
  </defs>
  <g transform="rotate(-6 260 360)">
    <rect x="50" y="40" width="420" height="620" rx="34" fill="url(#card)" stroke="#D8C9B0" stroke-width="4" filter="url(#shadow)"/>
    <rect x="76" y="66" width="368" height="568" rx="20" fill="none" stroke="#D7263D" stroke-width="3" opacity="0.5"/>
    <!-- corners -->
    <text x="96" y="124" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#D7263D">Q</text>
    <use href="#h" transform="translate(116 160) scale(1)" fill="#D7263D"/>
    <g transform="rotate(180 260 350)">
      <text x="96" y="124" font-family="Georgia, serif" font-size="56" font-weight="bold" fill="#D7263D">Q</text>
      <use href="#h" transform="translate(116 160)" fill="#D7263D"/>
    </g>
    <!-- crown -->
    <path d="M190 250 L 206 186 L 236 226 L 260 170 L 284 226 L 314 186 L 330 250 Z" fill="url(#gold)" stroke="#B37A12" stroke-width="4" stroke-linejoin="round"/>
    <rect x="186" y="246" width="148" height="22" rx="6" fill="url(#gold)" stroke="#B37A12" stroke-width="4"/>
    <circle cx="206" cy="182" r="8" fill="#D7263D"/><circle cx="260" cy="166" r="9" fill="#2BB3A3"/><circle cx="314" cy="182" r="8" fill="#D7263D"/>
    <!-- the heart -->
    <use href="#h" transform="translate(260 368) scale(5.6)" fill="url(#heart)"/>
    <path d="M196 326 C 206 308, 224 302, 236 308" fill="none" stroke="#FFFFFF" stroke-width="9" stroke-linecap="round" opacity="0.45"/>
    <!-- the stamp -->
    <g transform="translate(-26 -14) rotate(-10 260 560)" opacity="0.92">
      <rect x="112" y="518" width="296" height="80" rx="10" fill="#FFFFFF" fill-opacity="0.6" stroke="#D7263D" stroke-width="6"/>
      <rect x="123" y="529" width="274" height="58" rx="6" fill="none" stroke="#D7263D" stroke-width="2.5"/>
      <text x="260" y="553" font-family="Arial Black, Arial, sans-serif" font-size="21" font-weight="900" fill="#D7263D" text-anchor="middle" letter-spacing="1.5">OFF WITH THEIR</text>
      <text x="260" y="580" font-family="Arial Black, Arial, sans-serif" font-size="21" font-weight="900" fill="#D7263D" text-anchor="middle" letter-spacing="5">LICENSE!</text>
    </g>
  </g>
</svg>
