<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1100 640" width="1100" height="640">
  <!-- How the capillary cup holds coffee in zero g: side view (left) and top view (right). -->
  <defs>
    <linearGradient id="cup" x1="0" y1="0" x2="1" y2="0">
      <stop offset="0" stop-color="#FFFFFF" stop-opacity="0.9"/>
      <stop offset="1" stop-color="#DDEFF3" stop-opacity="0.9"/>
    </linearGradient>
    <linearGradient id="coffee" x1="0" y1="0" x2="0" y2="1">
      <stop offset="0" stop-color="#A8693A"/>
      <stop offset="1" stop-color="#4A2A14"/>
    </linearGradient>
    <marker id="arrow" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse">
      <path d="M0 0 L 10 5 L 0 10 Z" fill="#2BB3A3"/>
    </marker>
    <marker id="pointer" viewBox="0 0 10 10" refX="8" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse">
      <path d="M0 0 L 10 5 L 0 10 Z" fill="#3B2A6B"/>
    </marker>
  </defs>
  <style>
    .label { font-family: Arial, sans-serif; font-size: 22px; fill: #14123A; }
    .small { font-family: Arial, sans-serif; font-size: 18px; fill: #3B2A6B; }
    .title { font-family: Georgia, serif; font-size: 28px; font-weight: bold; fill: #14123A; }
  </style>

  <!-- ── side view ── -->
  <text x="250" y="48" class="title" text-anchor="middle">Side view</text>
  <!-- the cup: the right-hand wall folds into a sharp corner (the dashed crease) -->
  <path d="M120 120 L 380 120 L 350 560 C 348 580, 330 590, 310 590 L 190 590 C 170 590, 152 580, 150 560 Z" fill="url(#cup)" stroke="#8FB9C6" stroke-width="5" stroke-linejoin="round"/>
  <!-- coffee: a pool at the bottom, and a tongue climbing the corner -->
  <path d="M152 470 C 210 455, 300 485, 357 462 L 350 560 C 348 580, 330 590, 310 590 L 190 590 C 170 590, 152 580, 150 560 Z" fill="url(#coffee)"/>
  <path d="M330 470 C 340 360, 352 240, 366 128 L 380 120 L 357 462 C 350 468, 338 470, 330 470 Z" fill="url(#coffee)"/>
  <path d="M366 128 C 372 124, 382 122, 392 128 C 382 134, 372 134, 366 128 Z" fill="#A8693A"/>
  <line x1="372" y1="128" x2="352" y2="560" stroke="#5A8A99" stroke-width="3" stroke-dasharray="10 8"/>
  <!-- wicking arrows -->
  <path d="M410 470 C 420 380, 428 280, 436 170" fill="none" stroke="#2BB3A3" stroke-width="7" marker-end="url(#arrow)"/>
  <text x="452" y="310" class="label">coffee climbs</text>
  <text x="452" y="338" class="label">the corner</text>
  <!-- the lips: sip here -->
  <path d="M420 92 C 440 74, 470 74, 488 92 C 470 100, 440 100, 420 92 Z" fill="#E07A7A"/>
  <path d="M420 92 C 440 108, 470 108, 488 92" fill="none" stroke="#B5484E" stroke-width="4"/>
  <text x="500" y="100" class="label">sip here</text>
  <text x="250" y="625" class="small" text-anchor="middle">no gravity: the coffee goes where the cup's shape sends it</text>

  <!-- ── top view ── -->
  <text x="830" y="48" class="title" text-anchor="middle">Top view (cross-section)</text>
  <!-- teardrop: the sharp corner points right -->
  <path d="M1010 330 C 900 260, 820 180, 730 190 C 640 200, 610 280, 610 330 C 610 380, 640 460, 730 470 C 820 480, 900 400, 1010 330 Z" fill="url(#cup)" stroke="#8FB9C6" stroke-width="5"/>
  <!-- coffee gathers in the corner -->
  <path d="M1010 330 C 950 292, 900 262, 860 252 C 840 290, 840 370, 860 408 C 900 398, 950 368, 1010 330 Z" fill="url(#coffee)"/>
  <path d="M860 252 C 878 290, 878 370, 860 408" fill="none" stroke="#E7C08F" stroke-width="5" opacity="0.8"/>
  <!-- the corner angle -->
  <path d="M1010 330 L 900 262 M 1010 330 L 900 398" stroke="#3B2A6B" stroke-width="3" stroke-dasharray="7 6"/>
  <path d="M948 292 A 72 72 0 0 0 948 368" fill="none" stroke="#F2B33D" stroke-width="5"/>
  <path d="M975 312 L 1000 248" stroke="#3B2A6B" stroke-width="2.5"/>
  <text x="1000" y="238" class="label" text-anchor="middle" font-weight="bold">2α = 30°</text>
  <!-- contact angle detail -->
  <text x="830" y="535" class="label" text-anchor="middle">corner half-angle α = 15°  ·  contact angle θ ≈ 30°</text>
  <text x="830" y="568" class="label" text-anchor="middle" font-weight="bold" fill="#2BB3A3">α + θ = 45° &lt; 90°  →  it wicks</text>
  <text x="830" y="600" class="small" text-anchor="middle">(the Concus–Finn condition)</text>
  <path d="M640 140 C 690 150, 720 170, 740 190" fill="none" stroke="#3B2A6B" stroke-width="3" marker-end="url(#pointer)"/>
  <text x="560" y="140" class="small">no corner, no wicking</text>
</svg>
