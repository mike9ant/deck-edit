<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 1060 640" width="1060" height="640">
  <!-- The centrifugal brew chamber: spin gives the grounds their own gravity. -->
  <defs>
    <radialGradient id="drum" cx="50%" cy="50%" r="50%">
      <stop offset="0" stop-color="#F7FBFC"/>
      <stop offset="0.75" stop-color="#E3F1F4"/>
      <stop offset="1" stop-color="#C5DEE5"/>
    </radialGradient>
    <pattern id="grounds" width="16" height="16" patternUnits="userSpaceOnUse">
      <rect width="16" height="16" fill="#6B4226"/>
      <circle cx="4" cy="5" r="2.2" fill="#3E220F"/><circle cx="12" cy="11" r="2.6" fill="#8A5530"/><circle cx="11" cy="3" r="1.5" fill="#3E220F"/>
    </pattern>
    <marker id="spin" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="8" markerHeight="8" orient="auto-start-reverse"><path d="M0 0 L 10 5 L 0 10 Z" fill="#F2B33D"/></marker>
    <marker id="flow" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="6" markerHeight="6" orient="auto-start-reverse"><path d="M0 0 L 10 5 L 0 10 Z" fill="#2B8FD9"/></marker>
    <marker id="out" viewBox="0 0 10 10" refX="7" refY="5" markerWidth="7" markerHeight="7" orient="auto-start-reverse"><path d="M0 0 L 10 5 L 0 10 Z" fill="#6B4226"/></marker>
    <mask id="ring"><rect width="1060" height="640" fill="#fff"/><circle cx="340" cy="320" r="168" fill="#000"/></mask>
  </defs>
  <style>
    .label { font-family: Arial, sans-serif; font-size: 22px; fill: #14123A; }
    .big { font-family: Georgia, serif; font-size: 30px; font-weight: bold; fill: #14123A; }
  </style>

  <!-- drum -->
  <circle cx="340" cy="320" r="214" fill="url(#drum)" stroke="#8FB9C6" stroke-width="6"/>
  <!-- grounds packed against the wall -->
  <circle cx="340" cy="320" r="206" fill="url(#grounds)" mask="url(#ring)"/>
  <circle cx="340" cy="320" r="168" fill="none" stroke="#E7C08F" stroke-width="3" stroke-dasharray="4 6"/>
  <!-- water in at the center, flung outward -->
  <path d="M340 296 C 328 316, 328 334, 340 340 C 352 334, 352 316, 340 296 Z" fill="#2B8FD9"/>
  <g stroke="#2B8FD9" stroke-width="5" fill="none" marker-end="url(#flow)" stroke-linecap="round">
    <path d="M362 320 L 470 320"/><path d="M318 320 L 210 320"/><path d="M340 298 L 340 190"/><path d="M340 344 L 340 450"/>
    <path d="M356 304 L 428 232"/><path d="M324 336 L 252 408"/><path d="M324 304 L 252 232"/><path d="M356 336 L 428 408"/>
  </g>
  <!-- spin arrows -->
  <path d="M120 230 A 240 240 0 0 1 250 98" fill="none" stroke="#F2B33D" stroke-width="10" stroke-linecap="round" marker-end="url(#spin)"/>
  <path d="M560 410 A 240 240 0 0 1 430 542" fill="none" stroke="#F2B33D" stroke-width="10" stroke-linecap="round" marker-end="url(#spin)"/>
  <!-- coffee out at the rim -->
  <path d="M554 320 C 600 320, 620 330, 650 360" fill="none" stroke="#6B4226" stroke-width="12" stroke-linecap="round" marker-end="url(#out)"/>
  <text x="664" y="404" class="label">coffee out → to the cup</text>
  <!-- radius -->
  <line x1="340" y1="320" x2="490" y2="170" stroke="#3B2A6B" stroke-width="3" stroke-dasharray="8 6"/>
  <text x="500" y="166" class="label" font-weight="bold">r = 5 cm</text>

  <text x="640" y="120" class="big">ω = 134 rpm</text>
  <text x="640" y="166" class="label">a = ω²r ≈ 9.8 m/s²</text>
  <text x="640" y="196" class="label">= 1 g at the wall, so</text>
  <text x="640" y="226" class="label">water percolates as on Earth</text>
  <text x="340" y="590" class="label" text-anchor="middle">grounds are pressed to the wall;</text>
  <text x="340" y="618" class="label" text-anchor="middle">water passes through them, outward</text>
</svg>
