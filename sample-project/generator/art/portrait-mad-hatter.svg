<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 400 400" width="400" height="400">
  <!-- The Mad Hatter, Head of Blends: towering green hat with its 10/6 card, orange hair, polka-dot bow tie. -->
  <defs>
    <clipPath id="c"><circle cx="200" cy="200" r="194"/></clipPath>
    <linearGradient id="bg" x1="0" y1="0" x2="0" y2="1"><stop offset="0" stop-color="#B8EDE4"/><stop offset="1" stop-color="#2BB3A3"/></linearGradient>
    <linearGradient id="hat" x1="0" y1="0" x2="1" y2="0"><stop offset="0" stop-color="#3E9A6E"/><stop offset="1" stop-color="#1F5E40"/></linearGradient>
    <pattern id="dots" width="14" height="14" patternUnits="userSpaceOnUse"><rect width="14" height="14" fill="#F2B33D"/><circle cx="7" cy="7" r="3" fill="#D7263D"/></pattern>
  </defs>
  <g clip-path="url(#c)">
    <rect width="400" height="400" fill="url(#bg)"/>
    <!-- jacket -->
    <path d="M70 410 C 84 330, 140 310, 200 310 C 260 310, 316 330, 330 410 Z" fill="#5B3A8C"/>
    <path d="M168 312 L 200 360 L 232 312 Z" fill="#FFFFFF"/>
    <!-- bow tie -->
    <path d="M200 328 L 160 306 L 160 350 Z" fill="url(#dots)" stroke="#B0201F" stroke-width="3"/>
    <path d="M200 328 L 240 306 L 240 350 Z" fill="url(#dots)" stroke="#B0201F" stroke-width="3"/>
    <circle cx="200" cy="328" r="9" fill="#D7263D"/>
    <!-- hair tufts -->
    <path d="M118 210 C 90 200, 84 236, 100 252 C 86 262, 98 290, 122 280 Z" fill="#E86A2C"/>
    <path d="M282 210 C 310 200, 316 236, 300 252 C 314 262, 302 290, 278 280 Z" fill="#E86A2C"/>
    <!-- face -->
    <ellipse cx="200" cy="232" rx="78" ry="74" fill="#F7DEC8"/>
    <!-- eyes: big and a little mad -->
    <circle cx="170" cy="226" r="17" fill="#FFFFFF" stroke="#2B2B45" stroke-width="3"/>
    <circle cx="232" cy="222" r="21" fill="#FFFFFF" stroke="#2B2B45" stroke-width="3"/>
    <circle cx="174" cy="228" r="7" fill="#2B2B45"/><circle cx="236" cy="224" r="9" fill="#2B2B45"/>
    <path d="M148 200 Q 168 188 188 198" fill="none" stroke="#B24E1C" stroke-width="5" stroke-linecap="round"/>
    <path d="M210 190 Q 234 176 256 192" fill="none" stroke="#B24E1C" stroke-width="5" stroke-linecap="round"/>
    <!-- nose and grin -->
    <path d="M200 236 C 210 252, 208 258, 196 258" fill="none" stroke="#D9A78A" stroke-width="4" stroke-linecap="round"/>
    <path d="M152 268 Q 200 312 248 266 Q 200 286 152 268 Z" fill="#FFFFFF" stroke="#8A2E2E" stroke-width="4" stroke-linejoin="round"/>
    <g stroke="#C9B9B0" stroke-width="2"><path d="M176 276 V 292"/><path d="M200 279 V 298"/><path d="M224 276 V 292"/></g>
    <!-- the hat -->
    <g transform="rotate(-9 200 150)">
      <ellipse cx="200" cy="168" rx="122" ry="24" fill="#174A33"/>
      <path d="M128 162 L 112 30 C 150 14, 250 14, 288 30 L 272 162 Z" fill="url(#hat)"/>
      <path d="M126 140 L 274 140 L 272 162 L 128 162 Z" fill="#D7263D"/>
      <g transform="rotate(8 240 110)">
        <rect x="212" y="88" width="64" height="44" rx="4" fill="#FFF6E6" stroke="#8A6A4A" stroke-width="3"/>
        <text x="244" y="118" font-family="Georgia, serif" font-size="22" font-weight="bold" fill="#3B2A6B" text-anchor="middle">10/6</text>
      </g>
      <path d="M134 40 C 140 80, 142 110, 140 136" fill="none" stroke="#FFFFFF" stroke-width="8" stroke-linecap="round" opacity="0.25"/>
    </g>
  </g>
  <circle cx="200" cy="200" r="194" fill="none" stroke="#FFFFFF" stroke-width="10"/>
</svg>
